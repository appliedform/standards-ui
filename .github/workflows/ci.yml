name: checks

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Cheapest first, and in dependency order: a stale vendored contract
      # would make everything after it audit against the wrong thing.
      - name: meta.ts is generated, not hand-edited
        run: node scripts/generate.mjs --check

      - name: vendored contracts are current
        run: node scripts/freshness.mjs
        env:
          # Instrument's upstream is public. Set a token with access to
          # standards-packs to check the other five as well.
          GITHUB_TOKEN: ${{ secrets.PACKS_READ_TOKEN }}

      - run: npm ci --no-audit --no-fund
      - name: Install browser used by rendered workflow checks
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run audit
      - run: npm test
